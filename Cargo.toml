[package]
name = "vox"
version = "0.1.0"
edition = "2024"
description = "Telegram async messaging CLI for Claude Code agents"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
