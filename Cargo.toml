[package]
name = "vox"
version = "0.2.0"
edition = "2024"
description = "Telegram async messaging CLI for Claude Code agents"
license = "MIT"
repository = "https://github.com/simonspoon/vox"
readme = "README.md"
keywords = ["telegram", "cli", "claude", "bot", "messaging"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ctrlc = "3"
fs2 = "0.4"
